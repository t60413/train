<title>火車時刻</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: phone-width app centered on an electric-blue ambient field — onboarding, live map with glass bottom card, timetable list, glass tab bar */
:root{
  color-scheme:dark;
  --bg:#040817; --ink:#0a1128; --glass:rgba(22,34,78,.62); --stroke:rgba(120,150,255,.18);
  --blue:#2f63ff; --blue-hi:#6b95ff; --blue-deep:#1e3fc4; --fg:#eef2ff; --muted:#8c99c6; --dim:#56628f;
  --red:#ff6b7d; --ok:#4fe3a1;
  --font:"Nunito","Noto Sans TC",-apple-system,"PingFang TC",sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);-webkit-tap-highlight-color:transparent;overflow:hidden;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--blue-hi);outline-offset:2px}
.amb{position:fixed;inset:0;pointer-events:none;background:
  radial-gradient(40% 60% at 50% 0%,rgba(150,180,255,.45),transparent 70%),
  radial-gradient(35% 50% at 8% 70%,rgba(70,110,255,.35),transparent 70%),
  radial-gradient(35% 50% at 95% 75%,rgba(70,110,255,.3),transparent 70%),
  linear-gradient(180deg,#0a1440,#040817 70%)}
.app{position:relative;height:100%;max-width:460px;margin:0 auto;display:flex;flex-direction:column;background:var(--ink);overflow:hidden;box-shadow:0 0 0 1px var(--stroke),0 30px 80px rgba(0,0,0,.6)}
@media (min-width:600px){.app{height:calc(100% - 40px);margin-top:20px;border-radius:40px}}
.screen{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}

.top{background:radial-gradient(120% 140% at 80% -20%,#5b86ff,transparent 60%),linear-gradient(180deg,#3567ff,#244fe0);padding-block:16px 46px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:14px}
.circ{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;border:1.5px solid rgba(255,255,255,.35);color:#fff;transition:transform .15s}
.circ:active{transform:scale(.92)}
.top h1{margin:0;font-size:19px;font-weight:800}
.top p{margin:2px 0 0;font-size:13px;color:rgba(255,255,255,.72)}
.top .grow{flex:1;min-width:0}
.routepill{display:inline-flex;align-items:center;gap:6px;margin-top:3px;font-size:14px;color:#fff;font-weight:700}
.routepill span{opacity:.75}

.mapbox{position:relative;flex:1;min-height:0;margin-top:-30px;border-radius:30px 30px 0 0;overflow:hidden;background:#0a1024;box-shadow:0 -10px 30px rgba(0,0,0,.35)}
canvas{display:block;width:100%;height:100%;touch-action:none}
.locate{position:absolute;right:16px;bottom:280px;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:rgba(30,50,130,.75);border:1px solid var(--stroke);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:var(--blue-hi);transition:background .2s}
.locate.on{background:var(--blue);color:#fff;box-shadow:0 0 20px rgba(47,99,255,.6)}
.zoom{position:absolute;right:16px;top:16px;display:flex;flex-direction:column;border-radius:16px;overflow:hidden;background:rgba(20,32,80,.7);border:1px solid var(--stroke);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.zoom button{width:44px;height:40px;font-size:20px;color:var(--fg)}
.zoom button+button{border-top:1px solid var(--stroke)}
.card{position:absolute;left:12px;right:12px;bottom:12px;background:linear-gradient(180deg,rgba(46,72,170,.72),rgba(24,40,104,.86));border:1px solid rgba(140,170,255,.4);border-radius:24px;padding:8px 16px 16px;-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);box-shadow:0 20px 40px rgba(0,0,0,.45);display:flex;flex-direction:column;gap:12px}
.grab{width:40px;height:4px;border-radius:2px;background:rgba(255,255,255,.35);margin:0 auto}
.chead{display:flex;align-items:center;gap:12px}
.tile{flex:none;width:44px;height:44px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(160deg,color-mix(in srgb,var(--c,#2f63ff) 100%,#fff 25%),var(--c,#2f63ff));color:#fff;box-shadow:0 0 0 1px rgba(255,255,255,.18) inset,0 6px 16px color-mix(in srgb,var(--c,#2f63ff) 45%,transparent)}
.chead h2{margin:0;font-size:18px;font-weight:800}
.chead p{margin:1px 0 0;font-size:12px;color:var(--muted)}
.state{margin-left:auto;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:rgba(79,227,161,.14);color:var(--ok);white-space:nowrap}
.state.wait{background:rgba(140,153,198,.16);color:var(--muted)}
.state.stop{background:rgba(255,200,90,.16);color:#ffd27a}
.where{font-size:15px;padding:10px 12px;border-radius:12px;background:rgba(0,0,0,.2);color:var(--muted)}
.where b{color:#fff;font-weight:700}
.stats{display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:10px;padding-top:12px;border-top:1px solid rgba(160,185,255,.16)}
.stats div{min-width:0}
.stats small{display:block;font-size:11px;color:var(--muted)}
.stats b{display:block;font-size:14px;font-weight:700;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stats b.hl{color:var(--blue-hi);font-size:17px}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{display:flex;align-items:center;justify-content:center;gap:6px;padding:11px;border-radius:12px;font-size:14px;font-weight:700}
.btn.blue{background:var(--blue);color:#fff;box-shadow:0 6px 18px rgba(47,99,255,.35)}
.btn.line{background:rgba(255,255,255,.06);border:1px solid var(--stroke);color:#dfe6ff}
.btn:disabled{opacity:.35}

.scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;margin-top:-30px;border-radius:30px 30px 0 0;background:linear-gradient(180deg,#0f1a44,var(--ink) 340px);padding-block:18px 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
.scroll>*{flex-shrink:0}
.banner{padding:16px 18px;border-radius:22px;background:linear-gradient(135deg,#0a0f26,#1a2358);border:1px solid rgba(140,170,255,.22);box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 12px 30px rgba(0,0,0,.35)}
.banner h3{margin:0;font-size:17px;font-weight:800;color:var(--red)}
.banner p{margin:6px 0 0;font-size:13px;color:#cdd5f3;line-height:1.6}
.banner p b{color:var(--red)}
.route{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:12px;border-radius:18px;background:var(--glass);border:1px solid var(--stroke)}
.stn{display:flex;flex-direction:column;padding:4px 8px;border-radius:12px;text-align:left}
.stn:last-child{text-align:right;align-items:flex-end}
.stn small{font-size:11px;color:var(--muted)}
.stn b{font-size:21px;font-weight:800}
.swap{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--blue);color:#fff;transition:transform .35s}
.swap.spin{transform:rotate(180deg)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:8px;padding:6px 14px 6px 6px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid var(--stroke);font-size:14px;font-weight:700;color:#cfd7f5}
.chip i{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:rgba(255,255,255,.08);font-style:normal}
.chip[aria-pressed="true"]{background:rgba(20,30,80,.9);border-color:var(--blue-hi);color:#fff;box-shadow:0 0 0 1px rgba(107,149,255,.35),0 0 18px rgba(47,99,255,.25)}
.chip[aria-pressed="true"] i{background:var(--c);color:#fff;box-shadow:0 0 12px color-mix(in srgb,var(--c) 60%,transparent)}
.chip i{color:var(--c)}
.sect{display:flex;justify-content:space-between;align-items:baseline;font-size:16px;font-weight:800}
.sect span{font-size:12px;color:var(--muted);font-weight:600}
.list{display:flex;flex-direction:column;gap:12px}
.item{display:grid;grid-template-columns:86px minmax(0,1fr);gap:14px;padding:12px;border-radius:22px;background:linear-gradient(180deg,rgba(30,46,104,.55),rgba(18,28,70,.55));border:1px solid var(--stroke);text-align:left;width:100%}
.item.next{border-color:var(--blue-hi);box-shadow:0 0 0 1px rgba(107,149,255,.4),0 10px 30px rgba(47,99,255,.2)}
.thumb{height:92px;border-radius:16px;display:grid;place-items:center;position:relative;overflow:hidden;background:radial-gradient(70% 60% at 50% 35%,color-mix(in srgb,var(--c) 38%,transparent),transparent 72%),linear-gradient(180deg,#141d44,#0b1230);border:1px solid rgba(140,170,255,.14)}
.thumb svg{margin-top:-10px;filter:drop-shadow(0 6px 10px rgba(0,0,0,.45))}
.thumb small{position:absolute;bottom:6px;font-size:10px;font-weight:800;color:#dfe6ff;letter-spacing:.04em}
.info h4{margin:2px 0 0;font-size:16px;font-weight:800;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.info .times{margin-top:4px;font-size:22px;font-weight:800}
.info .times span{color:var(--blue-hi);margin:0 6px;font-size:16px}
.info .meta{font-size:12px;color:var(--muted);margin-top:2px}
.info .row{display:flex;align-items:center;justify-content:space-between;margin-top:10px;gap:8px}
.price{font-size:12px;color:var(--muted);display:flex;align-items:flex-start;gap:1px}
.price sup{font-size:11px;font-weight:800;color:#fff;margin-top:2px}
.price b{font-size:20px;color:#fff;line-height:1}
.price small{margin:6px 0 0 6px}
.pillbtn{display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:11px;background:rgba(60,100,255,.3);border:1px solid rgba(120,155,255,.3);color:#e3eaff;font-size:13px;font-weight:700;white-space:nowrap}
.item.next .pillbtn{background:var(--blue);color:#fff}
.cd{font-size:12px;font-weight:700;color:var(--blue-hi)}
.cd.soon{color:var(--ok)}
.empty{padding:30px 0;text-align:center;color:var(--muted)}
.foot{font-size:11px;color:var(--dim);text-align:center;line-height:1.7;margin:0}
.more{align-self:center;padding:8px 16px;border-radius:12px;border:1px solid var(--stroke);font-size:13px;color:var(--muted)}

.tabbar{display:grid;grid-template-columns:1fr 1fr;background:rgba(10,16,40,.95);border-top:1px solid var(--stroke);padding-bottom:max(6px,env(safe-area-inset-bottom,0px));padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0 6px;font-size:11px;font-weight:700;color:var(--dim)}
.tabbar button[aria-current="true"]{color:var(--blue-hi)}

.splash{position:absolute;inset:0;z-index:40;background:#03050d;display:flex;flex-direction:column;transition:opacity .45s,transform .45s}
.splash.out{opacity:0;transform:scale(1.04);pointer-events:none}
.splash svg{width:100%;flex:1;min-height:0}
.splash .txt{padding-block:0 24px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.splash h2{margin:0;font-size:30px;font-weight:800;line-height:1.3}
.splash p{margin:12px 0 0;font-size:15px;color:#b9c3e6;line-height:1.7}
.splash p b{color:#fff}
.dots{display:flex;gap:6px;margin:22px 0 28px}
.dots i{width:22px;height:4px;border-radius:2px;background:var(--blue-deep)}
.dots i:last-child{width:46px;background:var(--blue)}
.start{width:100%;padding:16px;border-radius:16px;background:linear-gradient(180deg,#4677ff,#2f5cf0);font-size:16px;font-weight:800;box-shadow:0 10px 30px rgba(47,99,255,.4);margin-bottom:max(8px,env(safe-area-inset-bottom,0px))}

.overlay{position:absolute;inset:0;z-index:30;background:rgba(2,4,14,.6);display:flex;align-items:flex-end;opacity:0;pointer-events:none;transition:opacity .25s}
.overlay.show{opacity:1;pointer-events:auto}
.sheet{width:100%;max-height:75%;display:flex;flex-direction:column;background:linear-gradient(180deg,#16245c,#0b1330);border-radius:28px 28px 0 0;border-top:1px solid var(--stroke);transform:translateY(100%);transition:transform .35s cubic-bezier(.2,.8,.2,1);padding-bottom:env(safe-area-inset-bottom,0px)}
.overlay.show .sheet{transform:none}
.sheet h3{margin:12px 0 14px;text-align:center;font-size:17px;font-weight:800}
.plist{overflow-y:auto;padding:0 16px 18px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.plist button{padding:12px 0;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid var(--stroke);font-size:15px;font-weight:600}
.plist button.cur{background:var(--blue);border-color:var(--blue-hi);font-weight:800}
.plist button.other{opacity:.4}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<style>
.circ.r{margin-left:auto}
.mode{display:inline-flex;align-items:center;gap:5px;margin-left:8px;font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px;background:rgba(255,255,255,.18);color:#fff;vertical-align:2px}
.mode i{width:6px;height:6px;border-radius:50%;background:#ffd27a}
.mode.on i{background:var(--ok);box-shadow:0 0 6px var(--ok)}
.dly{font-size:12px;font-weight:800;padding:3px 8px;border-radius:8px;background:rgba(79,227,161,.14);color:var(--ok);white-space:nowrap}
.dly.late{background:rgba(255,107,125,.16);color:var(--red)}
.stats b.ok{color:var(--ok)} .stats b.late{color:var(--red)}
.search{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--stroke);background:rgba(0,0,0,.25);color:var(--fg);font:inherit;font-size:16px;margin:0 0 12px}
.search::placeholder{color:var(--dim)}
.psub{grid-column:1/-1;font-size:12px;font-weight:800;color:var(--muted);margin:6px 2px 0}
.form{display:flex;flex-direction:column;gap:12px;padding:0 18px 20px}
.form label{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700;color:var(--muted)}
.form input{padding:12px 14px;border-radius:12px;border:1px solid var(--stroke);background:rgba(0,0,0,.25);color:var(--fg);font:inherit;font-size:15px}
.hint{margin:0;font-size:12px;color:var(--muted);line-height:1.6}
.msg{margin:0;font-size:13px;font-weight:700;min-height:18px}
.msg.err{color:var(--red)} .msg.ok{color:var(--ok)}
.toast{position:absolute;left:16px;right:16px;top:calc(12px + env(safe-area-inset-top,0px));z-index:50;padding:12px 14px;border-radius:14px;background:rgba(20,28,70,.95);border:1px solid var(--stroke);font-size:13px;font-weight:700;opacity:0;transform:translateY(-10px);transition:all .3s;pointer-events:none}
.toast.show{opacity:1;transform:none}
.loading{display:flex;align-items:center;justify-content:center;gap:10px;padding:30px 0;color:var(--muted);font-size:14px}
.spin{width:18px;height:18px;border-radius:50%;border:2.5px solid var(--stroke);border-top-color:var(--blue-hi);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.tp{font-size:11px;font-weight:800;padding:3px 7px;border-radius:7px;white-space:nowrap}
.tp.ok{background:rgba(79,227,161,.14);color:var(--ok)}
.tp.no{background:rgba(140,153,198,.14);color:var(--muted)}
.badges{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.qbar{display:flex;gap:8px;align-items:stretch}
.days{display:flex;gap:6px;flex:1;min-width:0}
.day{flex:1;padding:8px 4px;border-radius:12px;border:1px solid var(--stroke);background:rgba(255,255,255,.04);font-size:13px;font-weight:800;color:#cfd7f5;text-align:center;line-height:1.25}
.day small{display:block;font-size:10px;color:var(--muted);font-weight:700}
.day[aria-pressed="true"]{background:var(--blue);border-color:var(--blue-hi);color:#fff}
.day[aria-pressed="true"] small{color:#dfe6ff}
.qtime{position:relative;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:6px 12px;border-radius:12px;border:1px solid var(--stroke);background:rgba(255,255,255,.04);font-size:15px;font-weight:800;min-width:82px}
.qtime small{font-size:10px;color:var(--muted)}
.qtime input{position:absolute;inset:0;opacity:0;width:100%;height:100%;font-size:16px}
.qtime.set{border-color:var(--blue-hi);background:rgba(47,99,255,.22)}
.qnow{font-size:12px;font-weight:800;color:var(--blue-hi);align-self:flex-end;margin-top:-6px}
.item.gone{opacity:.5}
.item{cursor:pointer}
.acts{display:flex;gap:6px}
.pillbtn.lock{background:rgba(255,255,255,.06);border-color:var(--stroke)}
.pillbtn.lock.on{background:rgba(255,200,90,.18);border-color:rgba(255,200,90,.4);color:#ffd27a}
.btns.three{grid-template-columns:.8fr 1.3fr .8fr}
.btn.lockb{background:rgba(255,200,90,.14);border:1px solid rgba(255,200,90,.3);color:#ffd27a}
.tabbar{grid-template-columns:1fr 1fr 1fr}
.hero{padding:16px;border-radius:22px;background:linear-gradient(180deg,rgba(46,72,170,.62),rgba(24,40,104,.72));border:1px solid rgba(140,170,255,.35);display:flex;flex-direction:column;gap:14px;box-shadow:0 14px 34px rgba(0,0,0,.35)}
.nextst{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:end;padding:14px;border-radius:16px;background:rgba(0,0,0,.22)}
.nextst small{font-size:12px;color:var(--muted)}
.nextst b{font-size:26px;font-weight:800}
.nextst .eta{font-size:26px;font-weight:800;color:var(--blue-hi);text-align:right}
.nextst .sub{grid-column:1/-1;font-size:13px;color:var(--muted);margin-top:4px}
.prog{height:6px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--blue-hi));border-radius:3px;box-shadow:0 0 10px var(--blue)}
.tl{display:flex;flex-direction:column;padding:4px 14px;border-radius:20px;background:var(--glass);border:1px solid var(--stroke)}
.tst{display:grid;grid-template-columns:22px 1fr auto;gap:12px;align-items:center;min-height:50px;position:relative}
.tst::before{content:"";position:absolute;left:10px;top:0;bottom:0;width:2px;background:rgba(120,150,255,.25)}
.tst:first-child::before{top:50%}.tst:last-child::before{bottom:50%}
.tst.past::before{background:var(--blue)}
.tst i{position:relative;z-index:1;width:12px;height:12px;margin-left:5px;border-radius:50%;background:var(--ink);border:2px solid var(--blue-hi)}
.tst.past i{background:var(--blue);border-color:var(--blue)}
.tst.cur i{width:18px;height:18px;margin-left:2px;background:#fff;border:4px solid var(--blue);box-shadow:0 0 0 6px rgba(47,99,255,.25)}
.tst .n{font-size:16px;font-weight:700}
.tst.past .n{color:var(--muted)}
.tst.cur .n{font-weight:800}
.tst .n small{display:block;font-size:11px;color:var(--blue-hi);font-weight:800}
.tst.mark .n{color:var(--blue-hi)}
.tst .t{text-align:right;font-size:16px;font-weight:800}
.tst .t small{display:block;font-size:11px;color:var(--muted);font-weight:600}
.tst.past .t{color:var(--muted)}
.tst .t.late{color:var(--red)}
.lockin{grid-template-columns:1fr auto}
.lockin input{min-width:0;padding:12px 14px;border-radius:12px;border:1px solid var(--stroke);background:rgba(0,0,0,.25);color:var(--fg);font:inherit;font-size:18px;font-weight:800}
.lockgo{padding:0 20px;border-radius:12px;background:var(--blue);font-weight:800;color:#fff}
.quick{display:flex;flex-direction:column;gap:8px}

<script>
// ================= 共用工具 =================
const $=id=>document.getElementById(id);
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const jget=k=>{try{return JSON.parse(store.get(k)||"null")}catch(e){return null}};
const nowMin=()=>{const d=Date.now()/60000+480;return((d%1440)+1440)%1440};
const pad=x=>String(x).padStart(2,"0");
const fmt=m=>{const r=Math.round(m);return pad(Math.floor(((r%1440)+1440)%1440/60))+":"+pad(((r%60)+60)%60)};
const tm=s=>{if(!s)return null;const[h,m]=String(s).split(":");return(+h)*60+(+m)};
const dateStr=o=>{const d=new Date(Date.now()+480*6e4+o*864e5);return `${d.getUTCFullYear()}-${pad(d.getUTCMonth()+1)}-${pad(d.getUTCDate())}`};
const todayStr=()=>{const d=new Date(Date.now()+480*6e4);return `${d.getUTCFullYear()}-${pad(d.getUTCMonth()+1)}-${pad(d.getUTCDate())}`};
const norm=s=>String(s||"").replace(/台/g,"臺").trim();
const FONT="Nunito,'Noto Sans TC',sans-serif";
const TYPES={"自強":{c:"#2f63ff"},"莒光":{c:"#e0883a"},"區間快":{c:"#8a5cff"},"區間":{c:"#1aa7b3"}};
let toastT;function toast(t){const e=$("toast");e.textContent=t;e.classList.add("show");clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove("show"),3500)}

// ================= TDX 連線 =================
const API="https://tdx.transportdata.tw/api/basic/v3/Rail/TRA/";
const TOKEN_URL="https://tdx.transportdata.tw/auth/realms/TDXConnect/protocol/openid-connect/token";
let keys=jget("gl-keys"),token=null,tokenExp=0;
async function getToken(force){
  if(!force&&token&&Date.now()<tokenExp-6e4)return token;
  const c=jget("gl-token");if(!force&&c&&Date.now()<c.exp-6e4){token=c.t;tokenExp=c.exp;return token}
  let r;try{r=await fetch(TOKEN_URL,{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:new URLSearchParams({grant_type:"client_credentials",client_id:keys.id,client_secret:keys.secret})})}catch(e){throw new Error("連不上 TDX，請確認網路")}
  if(!r.ok)throw new Error(r.status===400||r.status===401?"金鑰不正確，請檢查 Client Id 和 Secret":"TDX 授權失敗（"+r.status+"）");
  const j=await r.json();token=j.access_token;tokenExp=Date.now()+(j.expires_in||86400)*1000;store.set("gl-token",JSON.stringify({t:token,exp:tokenExp}));return token;
}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
let qChain=Promise.resolve(),lastCall=0;
function throttle(){const p=qChain.then(async()=>{const w=lastCall+700-Date.now();if(w>0)await sleep(w);lastCall=Date.now()});qChain=p.catch(()=>{});return p}
async function api(path,tries=0,authRetried=false){
  const t=await getToken();await throttle();
  let r;try{r=await fetch(API+path+(path.includes("?")?"&":"?")+"%24format=JSON",{headers:{Authorization:"Bearer "+t}})}catch(e){throw new Error("連不上 TDX，請確認網路")}
  if(r.status===401&&!authRetried){token=null;store.del("gl-token");await getToken(true);return api(path,tries,true)}
  if(r.status===429){if(tries<4){await sleep(1500*(tries+1));return api(path,tries+1,authRetried)}throw new Error("TDX 查詢次數暫時用完，請過幾分鐘再試")}
  if(!r.ok)throw new Error("資料讀取失敗（"+r.status+"）");
  return r.json();
}
const arrOf=(j,k)=>Array.isArray(j)?j:(j&&j[k])||[];

// ================= 車站 =================
let STN=[],SID={},mode="demo";
async function loadStationsLive(){
  const c=jget("gl-stations");if(c&&Date.now()-c.t<7*864e5&&c.s.length)return c.s;
  const j=await api("Station");
  const s=arrOf(j,"Stations").filter(x=>x.StationPosition&&x.StationPosition.PositionLat).map(x=>({id:String(x.StationID),name:x.StationName.Zh_tw,lat:+x.StationPosition.PositionLat,lon:+x.StationPosition.PositionLon,major:["0","1"].includes(String(x.StationClass))}));
  store.set("gl-stations",JSON.stringify({t:Date.now(),s}));return s;
}
function setStations(s){STN=s;SID={};s.forEach(x=>SID[x.id]=x);routeLine=[];trips=[];buildStreets()}
const byName=n=>STN.find(s=>norm(s.name)===norm(n));

// ================= 車種 =================
function classify(n){n=n||"";
  if(/普悠瑪/.test(n))return{type:"自強",label:"普悠瑪"};if(/太魯閣/.test(n))return{type:"自強",label:"太魯閣"};
  if(/3000/.test(n))return{type:"自強",label:"自強3000"};if(/自強/.test(n))return{type:"自強",label:"自強"};
  if(/莒光/.test(n))return{type:"莒光",label:"莒光號"};if(/復興/.test(n))return{type:"莒光",label:"復興號"};
  if(/區間快/.test(n))return{type:"區間快",label:"區間快"};return{type:"區間",label:"區間"}}

// ================= 月票（TPASS 基北北桃） =================
const TP_BAD=/普悠瑪|太魯閣|3000|觀光|團體|郵輪|鳴日|藍皮|環島|專開/;
const inTP=s=>!!s&&s.lon>=121.06&&s.lat>=24.925&&!(s.lon>121.94&&s.lat<25.01);
const tpType=t=>!TP_BAD.test((t.raw||"")+t.label);
const tpOK=(t,a,b)=>tpType(t)&&inTP(SID[a])&&inTP(SID[b]);
const tpHtml=(t,a,b)=>tpOK(t,a,b)?`<span class="tp ok">月票可搭</span>`:`<span class="tp no">月票不適用</span>`;

// ================= 示範資料 =================
const DST=[["基隆",25.132,121.739,0],["三坑",25.123,121.742,3],["八堵",25.108,121.729,6],["七堵",25.093,121.714,10],["百福",25.077,121.694,13],["五堵",25.072,121.668,16],["汐止",25.068,121.656,19],["汐科",25.062,121.646,22],["南港",25.053,121.607,28],["松山",25.049,121.578,33],["臺北",25.048,121.517,39],["萬華",25.033,121.500,45],["板橋",25.014,121.464,50],["浮洲",25.004,121.445,54],["樹林",24.991,121.425,58],["南樹林",24.981,121.414,61],["山佳",24.973,121.392,65],["鶯歌",24.954,121.355,70],["鳳鳴",24.966,121.334,73],["桃園",24.989,121.314,78],["內壢",24.973,121.258,84],["中壢",24.954,121.226,89],["埔心",24.919,121.184,95],["楊梅",24.914,121.146,100],["富岡",24.935,121.083,107],["新富",24.931,121.065,110],["北湖",24.917,121.052,113],["湖口",24.903,121.044,117],["新豐",24.869,120.997,123],["竹北",24.839,121.009,129],["北新竹",24.809,120.990,132],["新竹",24.802,120.972,136]];
const DMAJ=new Set(["基隆","七堵","南港","松山","臺北","板橋","樹林","桃園","中壢","楊梅","竹北","新竹"]);
let demoTrains=null;
function buildDemo(){
  const names=DST.map(s=>s[0]),cum=n=>DST[names.indexOf(n)][3],T=[];
  const F={"自強":[.68,1],"莒光":[.78,1],"區間快":[.85,.7],"區間":[1,.5]},SUB=["自強3000","普悠瑪","自強","太魯閣"];let si=0;
  const mk=(type,no,dir,start,stops)=>{let st=stops.slice().sort((a,b)=>cum(a)-cum(b));if(dir<0)st.reverse();const[f,dw]=F[type];let t=start,p=null;
    const s=st.map((n,k)=>{if(k>0)t+=Math.abs(cum(n)-cum(p))*f;const a=t,d=(k===0||k===st.length-1)?t:t+dw;t=d;p=n;return{id:n,arr:a,dep:d}});
    T.push({no:String(no),type,label:type==="自強"?SUB[si++%4]:type==="莒光"?"莒光號":type,dest:st[st.length-1],stops:s,dir})};
  const EXP=["七堵","南港","松山","臺北","板橋","桃園","中壢","新竹"],SEMI=["基隆","七堵","汐止","南港","松山","臺北","萬華","板橋","樹林","鶯歌","桃園","內壢","中壢","埔心","楊梅","湖口","竹北","新竹"],CHU=["基隆","七堵","汐止","南港","松山","臺北","萬華","板橋","樹林","鶯歌","桃園","中壢","楊梅","新竹"];

let stopsBusy=false;
async function ensureStops(){
  if(mode!=="live"||stopsBusy)return;stopsBusy=true;
  try{const now=nowMin();
    const want=trips.filter(t=>!t.stops&&(t.no===selNo||(t.dep-90<now&&t.arr+15>now))).sort((a,b)=>(b.no===selNo)-(a.no===selNo)).slice(0,4);
    for(const t of want){try{t.stops=await loadStops(t.no)}catch(e){break}}
    if(want.length){computeRoute();renderCard()}
  }finally{stopsBusy=false}
}

  $("kMsg").textContent="連線中…";$("kMsg").className="msg";
  const old=keys;keys={id,secret};token=null;store.del("gl-token");
  try{await getToken(true);store.set("gl-keys",JSON.stringify(keys));$("kMsg").textContent="連線成功！正在讀取台鐵資料…";$("kMsg").className="msg ok";
    await startLive();setTimeout(()=>$("setOv").classList.remove("show"),600)}
  catch(e){keys=old;$("kMsg").textContent=e.message;$("kMsg").className="msg err"}
};
$("kClear").onclick=()=>{keys=null;token=null;["gl-keys","gl-token"].forEach(k=>store.del(k));$("setOv").classList.remove("show");startDemo();toast("已改用示範模式")};

// ================= 啟動 =================
function pickDefaults(){const r=jget("gl-route2")||{f:"桃園",t:"松山"};from=byName(r.f)||byName("桃園")||STN[0];to=byName(r.t)||byName("松山")||STN[1];if(from===to)to=STN.find(s=>s!==from)}
function setModeTag(){const e=$("modeTag");e.classList.toggle("on",mode==="live");e.lastChild.textContent=mode==="live"?"即時":"示範"}
function startDemo(){mode="demo";live=new Map();locked=null;if(!demoTrains)buildDemo();setStations(demoStations());pickDefaults();setModeTag();restoreLock();$("lFrom").textContent=from.name;$("lTo").textContent=to.name;view.init=false;refreshAll()}
async function startLive(){
  const s=await loadStationsLive();mode="live";locked=null;setStations(s);pickDefaults();setModeTag();restoreLock();
  $("lFrom").textContent=from.name;$("lTo").textContent=to.name;view.init=false;await refreshAll();
}
if(!store.get("gl-onboarded"))$("splash").hidden=false;
$("startBtn").onclick=()=>{store.set("gl-onboarded","1");$("splash").classList.add("out");setTimeout(()=>$("splash").hidden=true,460);if(mode==="demo"&&!keys)setTimeout(openSettings,600)};

new ResizeObserver(()=>{resize();if(!view.init&&from){fitRoute(true);view.init=true}}).observe(box);
resize();
(async()=>{
  if(keys){try{await startLive()}catch(e){toast(e.message+"，先用示範模式");startDemo()}}
  else startDemo();
})();
setInterval(()=>{if(document.hidden)return;if(screen==="live")renderCard();else if(screen==="table")renderTable();else renderMine()},5000);
setInterval(()=>{if(!document.hidden){refreshLive();ensureStops()}},60000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&mode==="live"&&Date.now()-liveAt>45000){refreshLive();ensureStops()}});
requestAnimationFrame(draw);
</script>
